<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orlene Bliss Nisnisan | Portfolio</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="description"
      content="Portfolio of Orlene Bliss Nisnisan - IT Student, Data Specialist, and Full-Stack Developer."
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              navy: "#0b1f3a",
              gold: "#f5a524",
              sand: "#f3f1ec",
              ink: "#1c1c1c",
              slateblue: "#2c3442",
            },
            boxShadow: {
              card: "0 28px 60px rgba(15, 23, 42, 0.12)",
              soft: "0 16px 30px rgba(15, 23, 42, 0.08)",
            },
            animation: {
              "spin-slow": "spin 8s linear infinite",
            },
          },
        },
      };
    </script>

    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: "Poppins", sans-serif;
        color: #0b0b0b;
        background: radial-gradient(
            circle at 15% 10%,
            rgba(245, 165, 36, 0.15),
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 15%,
            rgba(11, 31, 58, 0.08),
            transparent 45%
          ),
          linear-gradient(180deg, #f7f5f1, #f1eee8 60%, #faf8f5);
      }

      .section-anchor {
        scroll-margin-top: 100px;
      }

      .card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
      }

      .dark body {
        color: #e5e7eb;
        background: radial-gradient(
            circle at 15% 10%,
            rgba(245, 165, 36, 0.15),
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 15%,
            rgba(11, 31, 58, 0.3),
            transparent 45%
          ),
          linear-gradient(180deg, #0b1f3a, #0f172a 60%, #050b14);
      }
      .dark .card {
        background: rgba(15, 23, 42, 0.8);
        border-color: rgba(255, 255, 255, 0.05);
      }

      .modal-overlay {
        background: rgba(15, 23, 42, 0.72);
      }

      .modal-panel {
        transform: scale(0.96);
        opacity: 0;
        transition: all 0.25s ease;
      }

      .modal-open .modal-panel {
        transform: scale(1);
        opacity: 1;
      }

      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s ease-out;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }

      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #f7f5f1;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease;
      }
      .dark #loader {
        background: #0b1f3a;
      }
    </style>
  </head>
  <body class="text-ink relative selection:bg-gold/30">
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
